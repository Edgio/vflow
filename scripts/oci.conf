# OCI Object Store Configuration for vFlow sFlow data
# Configure these values according to your OCI setup

# OCI Region (e.g., us-phoenix-1, us-ashburn-1, etc.)
region: "us-phoenix-1"

# OCI Tenancy OCID
tenancy_ocid: "ocid1.tenancy.oc1..aaaaaaaExample"

# OCI User OCID  
user_ocid: "ocid1.user.oc1..aaaaaaaExample"

# Fingerprint of the public key added to the user
fingerprint: "aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99"

# Path to the private key file
private_key_path: "/path/to/oci_private_key.pem"

# Object Storage bucket name
bucket_name: "sflow-data"

# Object Storage namespace
namespace: "mycompany"

# Maximum size of each file chunk in MB before uploading
chunk_size_mb: 10

# How often to flush data to OCI (even if chunk size not reached)
flush_interval: "60s"